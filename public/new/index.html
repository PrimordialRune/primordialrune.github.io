<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Omar's Room</title>
<style>
/* Layout: one Trinitron filling the window. The room renders inside the tube; the nav (three bars under the glass) only moves you around the room. Menus and the letter are drawn inside the tube too. */
@font-face { font-family: "FK Grotesk"; src: url("fonts/FKGrotesk-Black.otf") format("opentype"); font-weight: 900; }
@font-face { font-family: "FK Grotesk"; src: url("fonts/FKGrotesk-Thin.otf") format("opentype"); font-weight: 200; }
@font-face { font-family: "8bitDarling"; src: url("fonts/8bitDarling-Regular.otf") format("opentype"); }
:root {
  --bg: #07141c;
  --frame: #0b0b0d;
  --cream: #fce8cd;
  --orange: #ec563b;
  --teal: #339999;
  --aqua: #4eb99f;
  --peacock: #102f41;
  --gold: #fadb68;
  --pixel: "8bitDarling", ui-monospace, monospace;
  --grotesk: "FK Grotesk", Helvetica, Arial, sans-serif;
}
/* The room is always dark: the page keeps one dark palette in both schemes on purpose. */
:root:not([data-theme="light"]) { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07141c; } }
:root[data-theme="dark"] { --bg: #07141c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--frame); color: var(--cream); font-family: var(--grotesk); overflow: hidden; }
/* Layout: the Trinitron is the whole window. Only its recessed rim frames the picture; the nav,
   the narrator and every menu are drawn inside the tube. */
.tv { position: fixed; inset: 0; height: 100dvh; background: var(--frame);
  padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); }
.glass { position: relative; width: 100%; height: 100%; border-radius: 18px / 24px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 2px #050506, 0 0 0 4px #1d1d21, inset 0 0 0 1px rgba(255,255,255,.04); }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.badge { position: absolute; bottom: max(4px, calc(env(safe-area-inset-bottom) - 12px)); left: 50%; transform: translateX(-50%); font: 900 9px/12px var(--grotesk); letter-spacing: .35em; color: #5d5d64; pointer-events: none; }
/* The DOM nav and credits stay for keyboards and screen readers; the tube draws what you see. */
.sr, nav, .credits, .quick { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
nav button:focus-visible, .quick:focus-visible { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); width: auto; height: auto; clip: auto; z-index: 3; padding: 8px 14px; background: var(--orange); color: var(--cream); border: 0; border-radius: 999px; font: 400 11px/1 var(--pixel); outline: 2px solid var(--gold); }
/* Phones held upright: the room only plays sideways. */
.tilt { display: none; }
@media (orientation: portrait) and (max-width: 900px) {
  .tilt { display: grid; position: fixed; inset: 0; z-index: 5; place-content: center; justify-items: center; gap: 14px; padding: 16px; background: var(--bg); text-align: center; }
  .tilt svg { width: 72px; height: 72px; animation: tilt 2.4s ease-in-out infinite; }
  .tilt p { margin: 0; font: 400 12px/1.6 var(--pixel); letter-spacing: .08em; }
  .tilt small { font: 900 12px/1 var(--grotesk); color: var(--aqua); letter-spacing: .1em; }
  .tilt a { font: 400 10px/1 var(--pixel); color: var(--gold); letter-spacing: .08em; padding: 14px 8px; }
}
@keyframes tilt { 0%, 20% { transform: rotate(0); } 50%, 80% { transform: rotate(-90deg); } 100% { transform: rotate(0); } }
@media (prefers-reduced-motion: reduce) { .tilt svg { animation: none; transform: rotate(-90deg); } }
</style>
</head>
<body>
  <div class="tv">
    <div class="glass">
      <canvas id="crt" aria-label="Omar's room, seen through a Trinitron. Press 1, 2 or 3 to move, the arrow keys to pick an object and Enter to use it."></canvas>
    </div>
    <div class="badge">TRINITRON</div>
  </div>
  <nav id="nav" aria-label="Move through the room">
    <button data-spot="desk" aria-current="true"><span class="num">01</span><span>DESK</span><small>デスク</small></button>
    <button data-spot="table"><span class="num">02</span><span>TABLE</span><small>テーブル</small></button>
    <button data-spot="drawer"><span class="num">03</span><span>DRAWER</span><small>ひきだし</small></button>
  </nav>
  <details class="credits"><summary>MODEL CREDITS</summary><p id="credits"></p></details>
  <a class="quick" href="quick/">IN A HURRY? QUICK VIEW</a>
<div class="tilt" role="alert">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="20" y="6" width="24" height="52" rx="5" fill="none" stroke="#fce8cd" stroke-width="3"/><rect x="24" y="12" width="16" height="36" fill="#ec563b"/><circle cx="32" cy="53" r="2" fill="#fce8cd"/></svg>
  <p>TURN YOUR PHONE SIDEWAYS</p>
  <small>よこにしてね</small>
  <a href="quick/">OR TAKE THE QUICK VIEW →</a>
</div>
<p class="sr" id="say" aria-live="polite"></p>
<script>
// No WebGL, no room: go straight to the quick view.
try { const c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) location.replace('quick/'); } catch (e) { location.replace('quick/'); }
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module" src="room.js"></script>
</body>
</html>
