<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omar's Room</title>
<style>
/* Layout: one Trinitron filling the window. The room renders inside the tube; the nav (three bars under the glass) only moves you around the room. Menus and the letter are drawn inside the tube too. */
@font-face { font-family: "FK Grotesk"; src: url("fonts/FKGrotesk-Black.otf") format("opentype"); font-weight: 900; }
@font-face { font-family: "FK Grotesk"; src: url("fonts/FKGrotesk-Thin.otf") format("opentype"); font-weight: 200; }
@font-face { font-family: "8bitDarling"; src: url("fonts/8bitDarling-Regular.otf") format("opentype"); }
:root {
  --bg: #07141c;
  --frame: #0b0b0d;
  --cream: #fce8cd;
  --orange: #ec563b;
  --teal: #339999;
  --aqua: #4eb99f;
  --peacock: #102f41;
  --gold: #fadb68;
  --pixel: "8bitDarling", ui-monospace, monospace;
  --grotesk: "FK Grotesk", Helvetica, Arial, sans-serif;
}
/* The room is always dark: the page keeps one dark palette in both schemes on purpose. */
:root:not([data-theme="light"]) { color-scheme: dark; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07141c; } }
:root[data-theme="dark"] { --bg: #07141c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: var(--grotesk); overflow: hidden; }
.wrap { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto auto; place-items: center; padding: 16px; gap: 12px; }
/* Trinitron: frame only, black, slightly rounded, flat-ish glass. */
.tv { position: relative; width: min(100%, calc((100vh - 140px) * 4 / 3)); aspect-ratio: 4 / 3; border-radius: 22px; background: var(--frame); padding: clamp(10px, 2.2vw, 26px); box-shadow: 0 0 0 1px #1c1c20, 0 30px 80px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.05); }
.glass { position: relative; width: 100%; height: 100%; border-radius: 10px / 14px; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.badge { position: absolute; bottom: calc(clamp(10px, 2.2vw, 26px) * 0.25); left: 50%; transform: translateX(-50%); font: 900 10px/1 var(--grotesk); letter-spacing: .35em; color: #6d6d74; pointer-events: none; }
/* Nav: Omar's scanlines, now a way to move through the room. */
nav { display: flex; gap: 10px; width: min(100%, 720px); }
nav button { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; padding: 8px 14px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--orange) 35%, transparent); color: var(--cream); font: 900 15px/1 var(--grotesk); letter-spacing: .04em; cursor: pointer; transition: background .2s, transform .2s; }
nav button small { font: 400 11px/1 var(--grotesk); opacity: .85; }
nav button[aria-current="true"] { background: var(--orange); }
nav button:hover { transform: translateY(-2px); }
nav button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
nav .num { font: 400 10px/1 var(--pixel); background: var(--peacock); padding: 4px 6px; border-radius: 6px; }
.hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font: 400 10px/1.4 var(--pixel); color: #5f7480; letter-spacing: .08em; white-space: nowrap; }
.foot { width: min(100%, 720px); display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
.quick { font: 400 10px/24px var(--pixel); letter-spacing: .08em; color: var(--gold); white-space: nowrap; text-decoration: none; min-height: 24px; }
.quick:hover, .quick:focus-visible { text-decoration: underline; }
.credits { flex: 1; font: 200 12px/1.5 var(--grotesk); color: #8aa0aa; }
.credits summary { font: 400 10px/1 var(--pixel); letter-spacing: .08em; cursor: pointer; min-height: 24px; }
.credits a { color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 640px) {
  .wrap { padding: 16px; }
  nav button small { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="hint">CLICK OBJECTS · ← → PICK · ENTER USE · ESC BACK · 1 2 3 MOVE</div>
<div class="wrap">
  <div class="tv">
    <div class="glass">
      <canvas id="crt" aria-label="Omar's room, seen through a Trinitron. Use the buttons below to move, arrow keys to pick an object and Enter to use it."></canvas>
    </div>
    <div class="badge">TRINITRON</div>
  </div>
  <nav id="nav" aria-label="Move through the room">
    <button data-spot="desk" aria-current="true"><span class="num">01</span><span>DESK</span><small>デスク</small></button>
    <button data-spot="table"><span class="num">02</span><span>TABLE</span><small>テーブル</small></button>
    <button data-spot="drawer"><span class="num">03</span><span>DRAWER</span><small>ひきだし</small></button>
  </nav>
  <div class="foot"><details class="credits"><summary>MODEL CREDITS</summary><p id="credits"></p></details><a class="quick" href="quick/">IN A HURRY? QUICK VIEW →</a></div>
</div>
<p class="sr" id="say" aria-live="polite"></p>
<script>
// No WebGL, no room: go straight to the quick view.
try { const c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) location.replace('quick/'); } catch (e) { location.replace('quick/'); }
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script type="module" src="room.js"></script>
</body>
</html>
